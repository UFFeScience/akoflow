name: AkôFlow example CI

on:
  workflow_call:
    inputs:
      examples_ref:
        description: Commit, branch, or tag from UFFeScience/akoflow-examples.
        required: false
        type: string
        default: main
      publish:
        description: Publish validated OCI images to GHCR.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      examples_ref:
        description: Commit, branch, or tag from UFFeScience/akoflow-examples.
        required: true
        type: string
        default: main
      publish:
        description: Publish validated OCI images to GHCR.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  discover:
    name: Discover examples
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - name: Checkout examples
        uses: actions/checkout@v4
        with:
          repository: UFFeScience/akoflow-examples
          ref: ${{ inputs.examples_ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build and validate the complete showcase matrix
        id: catalog
        shell: bash
        run: |
          matrix=$(go run ./tools/catalog)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  experiment-tools:
    name: Test experiment tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout examples
        uses: actions/checkout@v4
        with:
          repository: UFFeScience/akoflow-examples
          ref: ${{ inputs.examples_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Python tests
        run: python -m unittest discover -s experiments -p 'test_*.py'

  showcase:
    name: Validate ${{ matrix.showcase }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout examples
        uses: actions/checkout@v4
        with:
          repository: UFFeScience/akoflow-examples
          ref: ${{ inputs.examples_ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare local workload dependencies
        working-directory: ${{ matrix.category }}/${{ matrix.showcase }}
        run: ./prepare.sh
      - name: Validate the long scientific image and command contract
        if: matrix.validation == 'image-and-contract'
        working-directory: ${{ matrix.category }}/${{ matrix.showcase }}
        run: ./validate.sh -definition
      - name: Execute local workload and validate artifacts
        if: matrix.validation == 'full'
        working-directory: ${{ matrix.category }}/${{ matrix.showcase }}
        run: ./run.sh
      - name: Authenticate with GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.category }}/${{ matrix.showcase }}
          file: ${{ matrix.category }}/${{ matrix.showcase }}/docker/Dockerfile
          push: ${{ inputs.publish }}
          tags: |
            ${{ matrix.image }}

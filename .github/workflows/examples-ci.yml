name: AkôFlow example CI

on:
  workflow_call:
    inputs:
      examples_ref:
        description: Commit, branch, or tag from UFFeScience/akoflow-examples.
        required: false
        type: string
        default: main
      examples_base_ref:
        description: Base revision for selecting changed example directories; empty preserves full-catalog callers.
        required: false
        type: string
        default: ""
      all_examples:
        description: Explicitly validate and build every example.
        required: false
        type: boolean
        default: false
      publish:
        description: Publish validated OCI images to GHCR.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      examples_ref:
        description: Commit, branch, or tag from UFFeScience/akoflow-examples.
        required: true
        type: string
        default: main
      examples_base_ref:
        description: Base revision for selecting changed example directories; compared to examples_ref.
        required: false
        type: string
        default: "HEAD^"
      all_examples:
        description: Explicitly validate and build every example.
        required: false
        type: boolean
        default: false
      publish:
        description: Publish validated OCI images to GHCR.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  discover:
    name: Discover examples
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
      has_examples: ${{ steps.catalog.outputs.has_examples }}
    steps:
      - name: Checkout examples
        uses: actions/checkout@v4
        with:
          repository: UFFeScience/akoflow-examples
          ref: ${{ inputs.examples_ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Select changed example directories
        id: catalog
        shell: bash
        env:
          BASE_REF: ${{ inputs.examples_base_ref }}
          ALL_EXAMPLES: ${{ inputs.all_examples }}
          CHANGE_EVENT: ${{ github.event_name }}
        run: |
          args=()
          if [ "$ALL_EXAMPLES" != "true" ] && [ -n "$BASE_REF" ]; then
            if [[ ! "$BASE_REF" =~ ^0+$ ]] && ! git rev-parse --verify --end-of-options "${BASE_REF}^{commit}" >/dev/null 2>&1; then
              git fetch --no-tags origin "$BASE_REF"
            fi
            args+=(-changed-base "$BASE_REF")
            if [ "$CHANGE_EVENT" = "pull_request" ]; then
              args+=(-merge-base)
            fi
          fi
          matrix=$(go run ./tools/catalog "${args[@]}")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has_examples=$(jq 'length > 0' <<< "$matrix")" >> "$GITHUB_OUTPUT"
          {
            echo "### Selected examples"
            jq -r 'if length == 0 then "No example directories changed; workload execution and image builds are skipped." else .[] | "- \(.category)/\(.showcase)" end' <<< "$matrix"
          } >> "$GITHUB_STEP_SUMMARY"

  experiment-tools:
    name: Test experiment tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout examples
        uses: actions/checkout@v4
        with:
          repository: UFFeScience/akoflow-examples
          ref: ${{ inputs.examples_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Python tests
        run: python -m unittest discover -s experiments -p 'test_*.py'

  showcase:
    name: Validate ${{ matrix.showcase }}
    needs: discover
    if: needs.discover.outputs.has_examples == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout examples
        uses: actions/checkout@v4
        with:
          repository: UFFeScience/akoflow-examples
          ref: ${{ inputs.examples_ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare local workload dependencies
        working-directory: ${{ matrix.category }}/${{ matrix.showcase }}
        run: ./prepare.sh
      - name: Validate the long scientific image and command contract
        if: matrix.validation == 'image-and-contract'
        working-directory: ${{ matrix.category }}/${{ matrix.showcase }}
        run: ./validate.sh -definition
      - name: Execute local workload and validate artifacts
        if: matrix.validation == 'full'
        working-directory: ${{ matrix.category }}/${{ matrix.showcase }}
        run: ./run.sh
      - name: Authenticate with GHCR
        if: inputs.publish && startsWith(matrix.image, 'ghcr.io/uffescience/akoflow-examples/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish image
        if: ${{ !contains(matrix.image, '@sha256:') }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.category }}/${{ matrix.showcase }}
          file: ${{ matrix.category }}/${{ matrix.showcase }}/docker/Dockerfile
          push: ${{ inputs.publish && startsWith(matrix.image, 'ghcr.io/uffescience/akoflow-examples/') }}
          tags: |
            ${{ matrix.image }}

name: Publish GitHub release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test:
    name: Test daemon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  runtime-assets:
    name: Build runtime archives (${{ matrix.arch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build daemon archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: releases/dockerfiles/server.Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          tags: akoflow/daemon:${{ github.ref_name }}
          outputs: type=docker,dest=/tmp/akoflow-daemon-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar
          build-args: |
            AKOFLOW_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=runtime-daemon-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runtime-daemon-${{ matrix.arch }}

      - name: Build BuildKit archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: releases/dockerfiles/buildkit.Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          tags: akoflow/buildkit:${{ github.ref_name }}
          outputs: type=docker,dest=/tmp/akoflow-buildkit-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar
          build-args: |
            AKOFLOW_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=runtime-buildkit-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runtime-buildkit-${{ matrix.arch }}

      - name: Create runtime checksums
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          sha256sum \
            "akoflow-daemon-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.tar" \
            "akoflow-buildkit-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.tar" \
            > "akoflow-runtime-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.sha256"

      - name: Upload runtime archives
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.arch }}
          path: |
            /tmp/akoflow-daemon-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar
            /tmp/akoflow-buildkit-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar
            /tmp/akoflow-runtime-${{ github.ref_name }}-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error

  desktop:
    name: Package desktop (${{ matrix.artifact }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            command: npx electron-builder --mac --universal --publish never
            artifact: macos-universal
            signing: macos
          - runner: windows-latest
            command: npx electron-builder --win --x64 --publish never
            artifact: windows-x64
            signing: windows
          - runner: ubuntu-latest
            command: npx electron-builder --linux --x64 --publish never
            artifact: linux-x64
            signing: none
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout desktop source
        uses: actions/checkout@v6
        with:
          repository: UFFeScience/akoflow-desktop
          # Desktop releases intentionally package the current frontend main.
          ref: main
          # GITHUB_TOKEN is scoped to this repository and cannot read the
          # private desktop repository. Use a fine-grained cross-repo token.
          token: ${{ secrets.DESKTOP_REPOSITORY_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Derive the package version from the release tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version prefixed with v; received: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - run: npm version "${{ steps.version.outputs.value }}" --no-git-tag-version --allow-same-version
      - run: npm run build

      - name: Package desktop application
        run: ${{ matrix.command }}
        env:
          CSC_LINK: ${{ matrix.signing == 'macos' && secrets.MACOS_CSC_LINK || matrix.signing == 'windows' && secrets.WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.signing == 'macos' && secrets.MACOS_CSC_KEY_PASSWORD || matrix.signing == 'windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (matrix.signing == 'macos' && secrets.MACOS_CSC_LINK != '') || (matrix.signing == 'windows' && secrets.WINDOWS_CSC_LINK != '') }}
          APPLE_ID: ${{ matrix.signing == 'macos' && secrets.MACOS_APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.signing == 'macos' && secrets.MACOS_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.signing == 'macos' && secrets.MACOS_TEAM_ID || '' }}

      - name: Verify desktop artifact versions
        shell: bash
        run: |
          shopt -s nullglob
          packages=(release/*.dmg release/*.zip release/*.exe release/*.AppImage release/*.deb)
          if (( ${#packages[@]} == 0 )); then
            echo "No desktop packages were produced." >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            if [[ "$package" != *"${{ steps.version.outputs.value }}"* ]]; then
              echo "Artifact does not contain release version ${{ steps.version.outputs.value }}: $package" >&2
              exit 1
            fi
          done

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [runtime-assets, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: desktop-artifacts
          merge-multiple: true

      - name: Create AkôFlow release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: desktop-artifacts/*
          body: |
            ## Install AkôFlow Desktop

            AkôFlow Desktop requires Docker Desktop on macOS and Windows, or Docker Engine with the Compose v2 plugin on Linux. Download the matching asset below:

            - **macOS:** open the universal `.dmg`, drag AkôFlow Desktop to Applications, and launch it.
            - **Windows:** run the x64 installer `.exe`, or use the portable `.exe` without installation.
            - **Linux:** run the x64 `.AppImage` after `chmod +x`, or install the `.deb` with `sudo apt install ./Akoflow-Desktop-*.deb`.

            The matching source is the Git tag `${{ github.ref_name }}`. The runtime Docker archives in this release are loaded locally by Desktop; AkôFlow does not publish daemon or BuildKit packages to a container registry.

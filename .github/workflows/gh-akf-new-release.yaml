name: Publish GitHub release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing frozen source tag to package; never moves a tag.
        required: true
        type: string
        default: v1.0.11
      runtime_artifact_run:
        description: Optional completed tagged-push run whose successful runtime archives can be reused.
        required: false
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  actions: read

env:
  AKOFLOW_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test daemon
    runs-on: ubuntu-latest
    steps:
      - name: Validate frozen release tag
        shell: bash
        run: |
          if ! [[ "$AKOFLOW_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "A semantic version source tag is required." >&2
            exit 1
          fi
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.AKOFLOW_RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  runtime-assets:
    name: Build runtime archives (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.AKOFLOW_RELEASE_TAG }}

      - name: Verify runtime artifact provenance
        id: reuse
        if: inputs.runtime_artifact_run != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AKOFLOW_RUNTIME_RUN: ${{ inputs.runtime_artifact_run }}
          AKOFLOW_RUNTIME_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if ! [[ "$AKOFLOW_RUNTIME_RUN" =~ ^[0-9]+$ ]]; then
            echo "Runtime artifact run must be numeric." >&2
            exit 1
          fi
          source_sha=$(git rev-parse HEAD)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AKOFLOW_RUNTIME_RUN" |
            jq --exit-status --arg sha "$source_sha" --arg repo "$GITHUB_REPOSITORY" --arg tag "$AKOFLOW_RELEASE_TAG" \
              '.head_sha == $sha and .status == "completed" and .event == "push" and .head_branch == $tag and .head_repository.full_name == $repo' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AKOFLOW_RUNTIME_RUN/jobs" |
            jq --exit-status --arg name "Build runtime archives ($AKOFLOW_RUNTIME_ARCH)" \
              '[.jobs[] | select(.name == $name and .conclusion == "success")] | length == 1' >/dev/null
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Download verified runtime archives
        if: steps.reuse.outputs.enabled == 'true'
        uses: actions/download-artifact@v5
        with:
          name: runtime-${{ matrix.arch }}
          run-id: ${{ inputs.runtime_artifact_run }}
          github-token: ${{ github.token }}
          path: /tmp

      - name: Set up Docker Buildx
        if: steps.reuse.outputs.enabled != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build daemon archive
        if: steps.reuse.outputs.enabled != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: releases/dockerfiles/server.Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          tags: akoflow/daemon:${{ env.AKOFLOW_RELEASE_TAG }}
          outputs: type=docker,dest=/tmp/akoflow-daemon-${{ env.AKOFLOW_RELEASE_TAG }}-linux-${{ matrix.arch }}.tar
          build-args: |
            AKOFLOW_VERSION=${{ env.AKOFLOW_RELEASE_TAG }}
          cache-from: type=gha,scope=runtime-daemon-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runtime-daemon-${{ matrix.arch }}

      - name: Build BuildKit archive
        if: steps.reuse.outputs.enabled != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: releases/dockerfiles/buildkit.Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          tags: akoflow/buildkit:${{ env.AKOFLOW_RELEASE_TAG }}
          outputs: type=docker,dest=/tmp/akoflow-buildkit-${{ env.AKOFLOW_RELEASE_TAG }}-linux-${{ matrix.arch }}.tar
          build-args: |
            AKOFLOW_VERSION=${{ env.AKOFLOW_RELEASE_TAG }}
          cache-from: type=gha,scope=runtime-buildkit-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runtime-buildkit-${{ matrix.arch }}

      - name: Create runtime checksums
        if: steps.reuse.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          sha256sum \
            "akoflow-daemon-${AKOFLOW_RELEASE_TAG}-linux-${{ matrix.arch }}.tar" \
            "akoflow-buildkit-${AKOFLOW_RELEASE_TAG}-linux-${{ matrix.arch }}.tar" \
            > "akoflow-runtime-${AKOFLOW_RELEASE_TAG}-linux-${{ matrix.arch }}.sha256"

      - name: Verify runtime archive checksums
        shell: bash
        run: |
          cd /tmp
          sha256sum --check "akoflow-runtime-${AKOFLOW_RELEASE_TAG}-linux-${{ matrix.arch }}.sha256"

      - name: Upload runtime archives
        uses: actions/upload-artifact@v5
        with:
          name: runtime-${{ matrix.arch }}
          path: |
            /tmp/akoflow-daemon-${{ env.AKOFLOW_RELEASE_TAG }}-linux-${{ matrix.arch }}.tar
            /tmp/akoflow-buildkit-${{ env.AKOFLOW_RELEASE_TAG }}-linux-${{ matrix.arch }}.tar
            /tmp/akoflow-runtime-${{ env.AKOFLOW_RELEASE_TAG }}-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error

  desktop:
    name: Package desktop (${{ matrix.artifact }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            command: npx electron-builder --mac --universal --publish never
            artifact: macos-universal
            # Signing is opt-in. Do not pass a certificate value unless the
            # repository has a valid exported signing identity; an invalid
            # CSC_LINK otherwise makes an otherwise usable Desktop release
            # fail while producing the universal macOS package.
            signing: none
          - runner: windows-latest
            command: npx electron-builder --win --x64 --publish never --config.nsis.artifactName='Akoflow-Desktop-${version}-win-${arch}-setup.${ext}' --config.portable.artifactName='Akoflow-Desktop-${version}-win-${arch}-portable.${ext}'
            artifact: windows-x64
            signing: windows
          - runner: ubuntu-latest
            command: npx electron-builder --linux --x64 --publish never
            artifact: linux-x64
            signing: none
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout desktop source
        uses: actions/checkout@v6
        with:
          repository: UFFeScience/akoflow-desktop
          # Application source is immutable; packaging overrides are explicit.
          ref: refs/tags/${{ env.AKOFLOW_RELEASE_TAG }}
          # GITHUB_TOKEN is scoped to this repository and cannot read the
          # private desktop repository. Use a fine-grained cross-repo token.
          token: ${{ secrets.DESKTOP_REPOSITORY_TOKEN }}

      - name: Checkout release verification tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .release-tools

      - name: Set up Go verification tools
        uses: actions/setup-go@v6
        with:
          go-version-file: .release-tools/go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Derive the package version from the release tag
        id: version
        shell: bash
        run: |
          version="${AKOFLOW_RELEASE_TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version prefixed with v." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - run: npm version "${{ steps.version.outputs.value }}" --no-git-tag-version --allow-same-version
      - run: npm run build

      - name: Package desktop application
        run: ${{ matrix.command }}
        env:
          CSC_LINK: ${{ matrix.signing == 'macos' && secrets.MACOS_CSC_LINK || matrix.signing == 'windows' && secrets.WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.signing == 'macos' && secrets.MACOS_CSC_KEY_PASSWORD || matrix.signing == 'windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (matrix.signing == 'macos' && secrets.MACOS_CSC_LINK != '') || (matrix.signing == 'windows' && secrets.WINDOWS_CSC_LINK != '') }}
          APPLE_ID: ${{ matrix.signing == 'macos' && secrets.MACOS_APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.signing == 'macos' && secrets.MACOS_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.signing == 'macos' && secrets.MACOS_TEAM_ID || '' }}

      - name: Verify desktop artifact versions
        shell: bash
        run: |
          shopt -s nullglob
          packages=(release/*.dmg release/*.zip release/*.exe release/*.AppImage release/*.deb)
          if (( ${#packages[@]} == 0 )); then
            echo "No desktop packages were produced." >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            if [[ "$package" != *"${{ steps.version.outputs.value }}"* ]]; then
              echo "Artifact does not contain release version ${{ steps.version.outputs.value }}: $package" >&2
              exit 1
            fi
          done

      - name: Verify updater manifests against distributed files
        working-directory: .release-tools
        shell: bash
        run: go run ./cmd/release-assets-check --dir "$GITHUB_WORKSPACE/release" --version "$AKOFLOW_RELEASE_TAG"

      - name: Upload desktop package
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    name: Create verified GitHub release draft
    needs: [runtime-assets, desktop]
    runs-on: ubuntu-latest
    steps:
      # Runtime archives are large. Download each artifact in sequence so the
      # runner does not concurrently transfer and extract several multi-hundred
      # megabyte ZIPs, which has proven unreliable in release aggregation.
      - name: Download runtime archives (amd64)
        uses: actions/download-artifact@v5
        with:
          name: runtime-amd64
          path: release-assets

      - name: Download runtime archives (arm64)
        uses: actions/download-artifact@v5
        with:
          name: runtime-arm64
          path: release-assets

      - name: Download desktop package (macOS)
        uses: actions/download-artifact@v5
        with:
          name: macos-universal
          path: release-assets

      - name: Download desktop package (Windows)
        uses: actions/download-artifact@v5
        with:
          name: windows-x64
          path: release-assets

      - name: Download desktop package (Linux)
        uses: actions/download-artifact@v5
        with:
          name: linux-x64
          path: release-assets

      - name: Create AkôFlow release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.AKOFLOW_RELEASE_TAG }}
          draft: true
          generate_release_notes: true
          prerelease: ${{ contains(env.AKOFLOW_RELEASE_TAG, '-') }}
          files: release-assets/*
          body: |
            ## Install AkôFlow Desktop

            AkôFlow Desktop requires Docker Desktop on macOS and Windows, or Docker Engine with the Compose v2 plugin on Linux. Download the matching asset below:

            - **macOS:** open the universal `.dmg`, drag AkôFlow Desktop to Applications, and launch it.
            - **Windows:** run the x64 portable `.exe` asset without an installation wizard.
            - **Linux:** run the x64 `.AppImage` after `chmod +x`, or install the `.deb` with `sudo apt install ./Akoflow-Desktop-*.deb`.

            The application source is the frozen Git tag `${{ env.AKOFLOW_RELEASE_TAG }}`. Windows packaging uses distinct `setup` and `portable` filenames and all updater SHA512 manifests are verified before upload. The runtime Docker archives in this release are loaded locally by Desktop; AkôFlow does not publish daemon or BuildKit packages to a container registry. This draft must be reviewed before publication.

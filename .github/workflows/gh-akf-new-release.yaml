name: Publish production images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test daemon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  publish:
    name: Publish ${{ matrix.name }} image
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: daemon
            image: ghcr.io/uffescience/akoflow-daemon
            dockerfile: releases/dockerfiles/server.Dockerfile
          - name: buildkit
            image: ghcr.io/uffescience/akoflow-buildkit
            dockerfile: releases/dockerfiles/buildkit.Dockerfile
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=AkôFlow ${{ matrix.name }}
            org.opencontainers.image.description=AkôFlow production ${{ matrix.name }} image
            org.opencontainers.image.vendor=UFFeScience

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            AKOFLOW_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

      - name: Attest published image
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  desktop:
    name: Package desktop (${{ matrix.artifact }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            command: npx electron-builder --mac --universal --publish never
            artifact: macos-universal
            signing: macos
          - runner: windows-latest
            command: npx electron-builder --win --x64 --publish never
            artifact: windows-x64
            signing: windows
          - runner: ubuntu-latest
            command: npx electron-builder --linux --x64 --publish never
            artifact: linux-x64
            signing: none
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout desktop source
        uses: actions/checkout@v6
        with:
          repository: UFFeScience/akoflow-desktop
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm version "${{ github.ref_name }}" --no-git-tag-version
      - run: npm run build

      - name: Package desktop application
        run: ${{ matrix.command }}
        env:
          CSC_LINK: ${{ matrix.signing == 'macos' && secrets.MACOS_CSC_LINK || matrix.signing == 'windows' && secrets.WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.signing == 'macos' && secrets.MACOS_CSC_KEY_PASSWORD || matrix.signing == 'windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (matrix.signing == 'macos' && secrets.MACOS_CSC_LINK != '') || (matrix.signing == 'windows' && secrets.WINDOWS_CSC_LINK != '') }}
          APPLE_ID: ${{ matrix.signing == 'macos' && secrets.MACOS_APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.signing == 'macos' && secrets.MACOS_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.signing == 'macos' && secrets.MACOS_TEAM_ID || '' }}

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [publish, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          path: desktop-artifacts
          merge-multiple: true

      - name: Create AkôFlow release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: desktop-artifacts/*
          body: |
            ## AkôFlow Desktop

            Download the installer for macOS, Windows or Linux from the assets below. The application verifies Docker and Docker Compose, explains any missing requirement, and starts the AkôFlow daemon and BuildKit automatically.

            ## Container images

            This release publishes the following multi-platform OCI images for `linux/amd64` and `linux/arm64`:

            ```text
            ghcr.io/uffescience/akoflow-daemon:${{ github.ref_name }}
            ghcr.io/uffescience/akoflow-buildkit:${{ github.ref_name }}
            ```

            Set `AKOFLOW_VERSION=${{ github.ref_name }}` in Docker Compose to pin this exact release.

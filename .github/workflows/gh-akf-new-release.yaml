name: Publish GitHub release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing frozen source tag to package; never moves a tag.
        required: true
        type: string
        default: v1.0.14
      runtime_artifact_run:
        description: Optional completed tagged-push run whose successful runtime archives can be reused.
        required: false
        type: string
      macos_runner:
        description: macOS runner for rebuilding packages from the frozen source tag.
        required: false
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-26
      component_update:
        description: Publish a component-only prerelease and advance the in-app component channel.
        type: boolean
        default: false
      minimum_desktop:
        description: Exact compatible installed Desktop release for the component update (vX.Y.Z).
        type: string
      frontend_version:
        description: Frontend source version, defaulting to the release tag.
        type: string
      daemon_version:
        description: Daemon archive version, defaulting to the release tag.
        type: string
      buildkit_version:
        description: BuildKit archive version, defaulting to the compatible installed Desktop release.
        type: string
      rollback_safe:
        description: Confirm reversible data compatibility for all supported component versions.
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  actions: read

env:
  AKOFLOW_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test daemon
    runs-on: ubuntu-latest
    steps:
      - name: Validate frozen release tag
        shell: bash
        run: |
          if ! [[ "$AKOFLOW_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "A semantic version source tag is required." >&2
            exit 1
          fi
      - name: Verify component release inputs
        if: inputs.component_update
        env:
          MINIMUM_DESKTOP: ${{ inputs.minimum_desktop }}
          ROLLBACK_SAFE: ${{ inputs.rollback_safe }}
        run: |
          if ! [[ "$MINIMUM_DESKTOP" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$ROLLBACK_SAFE" != true ]]; then
            echo "Component updates require an installed Desktop version and verified reversible data compatibility." >&2
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.AKOFLOW_RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  runtime-assets:
    name: Build runtime archives (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.AKOFLOW_RELEASE_TAG }}

      - name: Verify runtime artifact provenance
        id: reuse
        if: inputs.runtime_artifact_run != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AKOFLOW_RUNTIME_RUN: ${{ inputs.runtime_artifact_run }}
          AKOFLOW_RUNTIME_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if ! [[ "$AKOFLOW_RUNTIME_RUN" =~ ^[0-9]+$ ]]; then
            echo "Runtime artifact run must be numeric." >&2
            exit 1
          fi
          source_sha=$(git rev-parse HEAD)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AKOFLOW_RUNTIME_RUN" |
            jq --exit-status --arg sha "$source_sha" --arg repo "$GITHUB_REPOSITORY" --arg tag "$AKOFLOW_RELEASE_TAG" \
              '.head_sha == $sha and .status == "completed" and .event == "push" and .head_branch == $tag and .head_repository.full_name == $repo' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AKOFLOW_RUNTIME_RUN/jobs" |
            jq --exit-status --arg name "Build runtime archives ($AKOFLOW_RUNTIME_ARCH)" \
              '[.jobs[] | select(.name == $name and .conclusion == "success")] | length == 1' >/dev/null
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Download verified runtime archives
        if: steps.reuse.outputs.enabled == 'true'
        uses: actions/download-artifact@v5
        with:
          name: runtime-${{ matrix.arch }}
          run-id: ${{ inputs.runtime_artifact_run }}
          github-token: ${{ github.token }}
          path: /tmp

      - name: Set up Docker Buildx
        if: steps.reuse.outputs.enabled != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build daemon archive
        if: steps.reuse.outputs.enabled != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: releases/dockerfiles/server.Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          tags: akoflow/daemon:${{ env.AKOFLOW_RELEASE_TAG }}
          outputs: type=docker,dest=/tmp/akoflow-daemon-${{ env.AKOFLOW_RELEASE_TAG }}-linux-${{ matrix.arch }}.tar
          build-args: |
            AKOFLOW_VERSION=${{ env.AKOFLOW_RELEASE_TAG }}
          cache-from: type=gha,scope=runtime-daemon-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runtime-daemon-${{ matrix.arch }}

      - name: Build BuildKit archive
        if: steps.reuse.outputs.enabled != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: releases/dockerfiles/buildkit.Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          tags: akoflow/buildkit:${{ env.AKOFLOW_RELEASE_TAG }}
          outputs: type=docker,dest=/tmp/akoflow-buildkit-${{ env.AKOFLOW_RELEASE_TAG }}-linux-${{ matrix.arch }}.tar
          build-args: |
            AKOFLOW_VERSION=${{ env.AKOFLOW_RELEASE_TAG }}
          cache-from: type=gha,scope=runtime-buildkit-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runtime-buildkit-${{ matrix.arch }}

      - name: Create runtime checksums
        if: steps.reuse.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          sha256sum \
            "akoflow-daemon-${AKOFLOW_RELEASE_TAG}-linux-${{ matrix.arch }}.tar" \
            "akoflow-buildkit-${AKOFLOW_RELEASE_TAG}-linux-${{ matrix.arch }}.tar" \
            > "akoflow-runtime-${AKOFLOW_RELEASE_TAG}-linux-${{ matrix.arch }}.sha256"

      - name: Verify runtime archive checksums
        shell: bash
        run: |
          cd /tmp
          sha256sum --check "akoflow-runtime-${AKOFLOW_RELEASE_TAG}-linux-${{ matrix.arch }}.sha256"

      - name: Upload runtime archives
        uses: actions/upload-artifact@v5
        with:
          name: runtime-${{ matrix.arch }}
          path: |
            /tmp/akoflow-daemon-${{ env.AKOFLOW_RELEASE_TAG }}-linux-${{ matrix.arch }}.tar
            /tmp/akoflow-buildkit-${{ env.AKOFLOW_RELEASE_TAG }}-linux-${{ matrix.arch }}.tar
            /tmp/akoflow-runtime-${{ env.AKOFLOW_RELEASE_TAG }}-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error

  frontend:
    name: Build portable frontend bundle
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: UFFeScience/akoflow-desktop
          ref: refs/tags/${{ env.AKOFLOW_RELEASE_TAG }}
          token: ${{ secrets.DESKTOP_REPOSITORY_TOKEN }}
          path: desktop
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: npm ci && npm run build
        working-directory: desktop
      - run: |
          go run ./cmd/component-release bundle desktop/dist "akoflow-frontend-$AKOFLOW_RELEASE_TAG.json"
          cp desktop/electron/component-update-key.pem component-update-key.pem
      - uses: actions/upload-artifact@v5
        with:
          name: frontend-bundle
          path: |
            akoflow-frontend-*.json
            component-update-key.pem
          if-no-files-found: error

  desktop:
    if: '!inputs.component_update'
    name: Package desktop (${{ matrix.artifact }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ${{ inputs.macos_runner || 'macos-15' }}
            command: npx electron-builder --mac --universal --publish never
            artifact: macos-universal
            signing: macos
          - runner: windows-latest
            command: npx electron-builder --win --x64 --publish never --config.nsis.artifactName='Akoflow-Desktop-${version}-win-${arch}-setup.${ext}' --config.portable.artifactName='Akoflow-Desktop-${version}-win-${arch}-portable.${ext}'
            artifact: windows-x64
            signing: windows
          - runner: ubuntu-latest
            command: npx electron-builder --linux --x64 --publish never
            artifact: linux-x64
            signing: none
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout desktop source
        uses: actions/checkout@v6
        with:
          repository: UFFeScience/akoflow-desktop
          # Application source is immutable; packaging overrides are explicit.
          ref: refs/tags/${{ env.AKOFLOW_RELEASE_TAG }}
          # GITHUB_TOKEN is scoped to this repository and cannot read the
          # private desktop repository. Use a fine-grained cross-repo token.
          token: ${{ secrets.DESKTOP_REPOSITORY_TOKEN }}

      - name: Checkout release verification tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .release-tools

      - name: Set up Go verification tools
        uses: actions/setup-go@v6
        with:
          go-version-file: .release-tools/go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Derive the package version from the release tag
        id: version
        shell: bash
        run: |
          version="${AKOFLOW_RELEASE_TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version prefixed with v." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - run: npm version "${{ steps.version.outputs.value }}" --no-git-tag-version --allow-same-version
      - run: npm run build

      - name: Configure macOS signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MACOS_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          if [[ -f scripts/configure-macos-signing.cjs ]]; then
            node scripts/configure-macos-signing.cjs
          elif [[ -n "$CSC_LINK" ]]; then
            echo "The frozen Desktop source predates verified macOS signing support." >&2
            exit 1
          else
            echo "Legacy unsigned macOS source: automatic installation updates are unsupported."
          fi

      - name: Package desktop application
        run: ${{ matrix.command }}
        env:
          CSC_LINK: ${{ matrix.signing == 'macos' && secrets.MACOS_CSC_LINK || matrix.signing == 'windows' && secrets.WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.signing == 'macos' && secrets.MACOS_CSC_KEY_PASSWORD || matrix.signing == 'windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (matrix.signing == 'macos' && secrets.MACOS_CSC_LINK != '') || (matrix.signing == 'windows' && secrets.WINDOWS_CSC_LINK != '') }}
          APPLE_ID: ${{ matrix.signing == 'macos' && secrets.MACOS_APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.signing == 'macos' && secrets.MACOS_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.signing == 'macos' && secrets.MACOS_TEAM_ID || '' }}

      - name: Verify signed macOS application and notarization
        if: runner.os == 'macOS' && env.AKOFLOW_MACOS_SIGNING_REQUESTED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          app_path=$(find release/mac-universal -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app_path"
          codesign --verify --deep --strict "$app_path"
          codesign --display --verbose=4 "$app_path" 2>&1 | grep -q '^Authority=Developer ID Application:'
          xcrun stapler validate "$app_path"
          spctl --assess --type execute "$app_path"

      - name: Verify desktop artifact versions
        shell: bash
        run: |
          shopt -s nullglob
          packages=(release/*.dmg release/*.zip release/*.exe release/*.AppImage release/*.deb)
          if (( ${#packages[@]} == 0 )); then
            echo "No desktop packages were produced." >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            if [[ "$package" != *"${{ steps.version.outputs.value }}"* ]]; then
              echo "Artifact does not contain release version ${{ steps.version.outputs.value }}: $package" >&2
              exit 1
            fi
          done

      - name: Verify updater manifests against distributed files
        working-directory: .release-tools
        shell: bash
        run: go run ./cmd/release-assets-check --dir "$GITHUB_WORKSPACE/release" --version "$AKOFLOW_RELEASE_TAG"

      - name: Upload desktop package
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    name: Publish verified GitHub release
    needs: [runtime-assets, desktop, frontend]
    if: ${{ !cancelled() && needs.runtime-assets.result == 'success' && needs.frontend.result == 'success' && (needs.desktop.result == 'success' || inputs.component_update) }}
    runs-on: ubuntu-latest
    steps:
      # Runtime archives are large. Download each artifact in sequence so the
      # runner does not concurrently transfer and extract several multi-hundred
      # megabyte ZIPs, which has proven unreliable in release aggregation.
      - name: Download runtime archives (amd64)
        uses: actions/download-artifact@v5
        with:
          name: runtime-amd64
          path: release-assets

      - name: Download runtime archives (arm64)
        uses: actions/download-artifact@v5
        with:
          name: runtime-arm64
          path: release-assets

      - name: Download desktop package (macOS)
        if: '!inputs.component_update'
        uses: actions/download-artifact@v5
        with:
          name: macos-universal
          path: release-assets

      - name: Download desktop package (Windows)
        if: '!inputs.component_update'
        uses: actions/download-artifact@v5
        with:
          name: windows-x64
          path: release-assets

      - name: Download desktop package (Linux)
        if: '!inputs.component_update'
        uses: actions/download-artifact@v5
        with:
          name: linux-x64
          path: release-assets

      - name: Checkout release screenshots
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.AKOFLOW_RELEASE_TAG }}
          path: release-source

      - name: Collect release screenshots
        run: |
          shopt -s nullglob
          for screenshot in "release-source/docs/static/img/releases/$AKOFLOW_RELEASE_TAG/"*.png; do
            cp "$screenshot" release-assets/
          done

      - name: Download frontend bundle
        uses: actions/download-artifact@v5
        with:
          name: frontend-bundle
          path: frontend-assets

      - uses: actions/setup-go@v6
        with:
          go-version-file: release-source/go.mod
          cache: false

      - name: Sign the component manifest
        env:
          GH_TOKEN: ${{ github.token }}
          AKOFLOW_COMPONENT_SIGNING_KEY: ${{ secrets.AKOFLOW_COMPONENT_SIGNING_KEY }}
          MINIMUM_DESKTOP: ${{ inputs.minimum_desktop }}
          FRONTEND_VERSION: ${{ inputs.frontend_version }}
          DAEMON_VERSION: ${{ inputs.daemon_version }}
          BUILDKIT_VERSION: ${{ inputs.buildkit_version }}
          COMPONENT_UPDATE: ${{ inputs.component_update }}
        run: |
          cp frontend-assets/akoflow-frontend-*.json release-assets/
          if [[ "$COMPONENT_UPDATE" == true ]]; then
            BUILDKIT_VERSION="${BUILDKIT_VERSION:-$MINIMUM_DESKTOP}"
          fi
          cd release-source
          go run ./cmd/component-release sign ../release-assets "$AKOFLOW_RELEASE_TAG" \
            "${MINIMUM_DESKTOP:-$AKOFLOW_RELEASE_TAG}" "${FRONTEND_VERSION:-$AKOFLOW_RELEASE_TAG}" \
            "${DAEMON_VERSION:-$AKOFLOW_RELEASE_TAG}" "${BUILDKIT_VERSION:-$AKOFLOW_RELEASE_TAG}" \
            ../frontend-assets/component-update-key.pem

      - name: Prepare release notes
        shell: bash
        run: |
          notes="release-source/releases/notes/$AKOFLOW_RELEASE_TAG.md"
          if [[ -f "$notes" ]]; then
            cat "$notes" > release-notes.md
            printf '\n\n' >> release-notes.md
          fi
          if [[ "${{ inputs.component_update }}" == true ]]; then
            printf '%s\n' 'Apply this component update through Settings → Updates in a compatible AkôFlow Desktop installation.' >> release-notes.md
            exit 0
          fi
          cat >> release-notes.md <<EOF
          ## Install AkôFlow Desktop

          AkôFlow Desktop requires Docker Desktop on macOS and Windows, or Docker Engine with the Compose v2 plugin on Linux. Download the matching asset below:

          - **macOS:** open the universal \`.dmg\`, drag AkôFlow Desktop to Applications, and launch it.
          - **Windows:** run the x64 portable \`.exe\` asset without an installation wizard.
          - **Linux:** run the x64 \`.AppImage\` after \`chmod +x\`, or install the \`.deb\` with \`sudo apt install ./Akoflow-Desktop-*.deb\`.

          The application source is the frozen Git tag \`$AKOFLOW_RELEASE_TAG\`. Windows packaging uses distinct \`setup\` and \`portable\` filenames and all updater SHA512 manifests are verified before upload. The runtime Docker archives in this release are loaded locally by Desktop; AkôFlow does not publish daemon or BuildKit packages to a container registry.
          EOF

      - name: Create AkôFlow release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.AKOFLOW_RELEASE_TAG }}
          draft: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ inputs.component_update }}
          make_latest: ${{ inputs.component_update && 'false' || 'true' }}
          files: release-assets/*
          body_path: release-notes.md

      - name: Advance the signed component channel
        if: inputs.component_update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view desktop-components --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create desktop-components --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title 'Desktop component update channel' \
              --notes 'Signed manifest consumed by compatible AkôFlow Desktop installations.'
          fi
          gh release upload desktop-components release-assets/components.json --repo "$GITHUB_REPOSITORY" --clobber

services:
  akoflow-server:
    restart: unless-stopped
    build:
      context: .
      dockerfile: releases/dockerfiles/server.dev.Dockerfile
    command: /usr/local/go/bin/go run ./cmd/server
    environment:
      AKOFLOW_HTTP_ADDRESS: 0.0.0.0:8080
      # These defaults make the development stack runnable on a fresh clone.
      # Override both values in .env for any shared or production deployment.
      AKOFLOW_API_TOKEN: ${AKOFLOW_API_TOKEN:-akoflow-development-token}
      AKOFLOW_API_ALLOWED_ORIGINS: ${AKOFLOW_API_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      AKOFLOW_ARTIFACT_STORE_ROOT: /var/lib/akoflow/artifacts
      AKOFLOW_BUILDCTL: buildctl
      AKOFLOW_APPTAINER: apptainer
      AKOFLOW_SIMGRID_BINARY: /usr/local/bin/akoflow-simgrid-runner
      AKOFLOW_RESTART_ON_INSTANCE_SWITCH: 'true'
      AKOFLOW_KIND_TOKEN: ${AKOFLOW_KIND_TOKEN:-}
      # Interactive terminals are enabled only for the local control-plane
      # deployment. The runner still uses each environment's SSH credentials
      # and SLURM allocation rules.
      AKOFLOW_CONSOLE_ENABLED: ${AKOFLOW_CONSOLE_ENABLED:-true}
      BUILDKIT_HOST: tcp://buildkitd:1234
    volumes:
      - .:/app
      - go-module-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - artifact-store:/var/lib/akoflow/artifacts
      # Plans, preparation state and execution history need to survive a
      # release container recreation. This starts as a clean database volume.
      - ./storage/:/app/storage
      # Service keys generated by the local control plane are kept in the
      # workspace credential directory. Production deployments may mount a
      # dedicated credential volume with their own access policy.
      # The local runtime provisions containers through the Docker daemon on
      # the development host. Do not use this mount for shared deployments.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    depends_on:
      buildkitd:
        condition: service_started
    # Apptainer needs mount/fuse support to create SIF.
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
  buildkitd:
    image: moby/buildkit:latest
    command: ["buildkitd", "--addr", "tcp://0.0.0.0:1234"]
    volumes:
      - buildkit-state:/var/lib/buildkit
      - artifact-store:/var/lib/akoflow/artifacts
    privileged: true
volumes:
  artifact-store:
  buildkit-state:
  engine-data:
  go-module-cache:
  go-build-cache:

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" role="img" aria-labelledby="title desc">
  <title id="title">Makespan and accumulated compute time</title><desc id="desc">Two activities each run for ten seconds at the same time. Wall-clock makespan is ten seconds, whereas accumulated compute time is twenty seconds because both activity durations are added.</desc>
  <rect width="960" height="230" rx="14" fill="#fff" stroke="#151515"/><g font-family="system-ui, sans-serif" fill="#151515"><text x="65" y="54" font-size="13" font-weight="700">Clock time</text><text x="65" y="108" font-size="13" font-weight="700">Activity A</text><text x="65" y="156" font-size="13" font-weight="700">Activity B</text></g><g stroke="#151515" stroke-width="1.5"><path d="M190 48H820"/><path d="M190 42V54M820 42V54"/></g><g font-family="system-ui, sans-serif" font-size="12"><text x="184" y="32">0 s</text><text x="806" y="32">10 s</text></g><rect x="190" y="84" width="630" height="30" rx="5" fill="#f2f2f2" stroke="#151515"/><rect x="190" y="132" width="630" height="30" rx="5" fill="#f2f2f2" stroke="#151515"/><g font-family="system-ui, sans-serif" font-size="12" text-anchor="middle"><text x="505" y="103">runtime 10 s</text><text x="505" y="151">runtime 10 s</text></g><g font-family="system-ui, sans-serif" fill="#151515"><text x="190" y="204" font-size="14" font-weight="700">Makespan: 10 s</text><text x="540" y="204" font-size="14" font-weight="700">Accumulated compute: 20 s</text></g>
</svg>

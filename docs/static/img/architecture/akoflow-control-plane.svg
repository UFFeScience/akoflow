<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1250" viewBox="0 0 1440 1250" role="img" aria-labelledby="title desc">
  <title id="title">AkôFlow control-plane architecture</title>
  <desc id="desc">Desktop and API clients connect to the AkôFlow daemon. The daemon contains workflow control, planning, execution, and a scientific SQLite record, and connects to runtime adapters.</desc>
  <style>
    .paper{fill:#fff}.wash{fill:#f3f3f1}.ink{fill:#121212}.line{stroke:#121212;stroke-width:3}.rule{stroke:#d7d7d2;stroke-width:2}.frame{fill:#fff;stroke:#121212;stroke-width:3}.soft{fill:#f3f3f1;stroke:#121212;stroke-width:3}.dark{fill:#121212;stroke:#121212;stroke-width:3}.title{font-family:Arial,sans-serif;font-size:56px;font-weight:700;letter-spacing:-2px}.kicker{font-family:Arial,sans-serif;font-size:16px;font-weight:700;letter-spacing:3px}.label{font-family:Arial,sans-serif;font-size:19px;font-weight:700}.body{font-family:Arial,sans-serif;font-size:15px;font-weight:400}.small{font-family:Arial,sans-serif;font-size:14px;font-weight:700;letter-spacing:1px}.white{fill:#fff}.muted{fill:#696965}.arrow{fill:none;stroke:#121212;stroke-width:3;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#121212"/></marker></defs>
  <rect class="wash" width="1440" height="1250"/><rect class="paper" x="54" y="48" width="1332" height="1148" rx="10"/><rect class="ink" x="54" y="48" width="1332" height="12"/>
  <text class="kicker muted" x="112" y="128">ARCHITECTURE OVERVIEW</text><text class="title ink" x="112" y="193">AkôFlow control plane</text><text class="body muted" x="112" y="228">Workflow planning, runtime orchestration, and scientific evidence in one local service.</text><line class="rule" x1="112" y1="270" x2="1328" y2="270"/>
  <rect class="frame" x="112" y="326" width="1216" height="158" rx="22"/><rect class="dark" x="144" y="304" width="236" height="38" rx="7"/><text class="small white" x="164" y="329">CLIENT APPLICATIONS</text>
  <rect class="frame" x="150" y="368" width="551" height="82" rx="11"/><text class="label ink" x="177" y="402">AkôFlow Desktop</text><text class="body muted" x="177" y="428">Visual control of workflows, plans, runs, and evidence.</text>
  <rect class="frame" x="739" y="368" width="551" height="82" rx="11"/><text class="label ink" x="766" y="402">API clients</text><text class="body muted" x="766" y="428">Automation and reproducible scientific experiments.</text>
  <path class="arrow" d="M720 485v52"/><text class="small muted" x="616" y="521">AUTHENTICATED HTTP API</text>
  <rect class="soft" x="112" y="570" width="1216" height="408" rx="22"/><rect class="dark" x="144" y="548" width="194" height="38" rx="7"/><text class="small white" x="164" y="573">AKÔFLOW DAEMON</text><text class="label ink" x="148" y="626">Control plane</text><text class="body muted" x="148" y="652">HTTP API · application services · persistent event loop</text>
  <rect class="frame" x="148" y="685" width="362" height="190" rx="12"/><rect class="dark" x="148" y="685" width="362" height="45" rx="12"/><rect class="dark" x="148" y="711" width="362" height="19"/><text class="label white" x="170" y="714">Workflow control</text><text class="body ink" x="176" y="766">• Definitions and versions</text><text class="body ink" x="176" y="797">• Environments and scopes</text><text class="body ink" x="176" y="828">• Artifacts and data records</text>
  <rect class="frame" x="539" y="685" width="362" height="190" rx="12"/><rect class="dark" x="539" y="685" width="362" height="45" rx="12"/><rect class="dark" x="539" y="711" width="362" height="19"/><text class="label white" x="561" y="714">Planning</text><text class="body ink" x="567" y="766">• HEFT and PRISM</text><text class="body ink" x="567" y="797">• Candidate plans</text><text class="body ink" x="567" y="828">• Selected assignments</text>
  <rect class="frame" x="930" y="685" width="362" height="190" rx="12"/><rect class="dark" x="930" y="685" width="362" height="45" rx="12"/><rect class="dark" x="930" y="711" width="362" height="19"/><text class="label white" x="952" y="714">Execution</text><text class="body ink" x="958" y="766">• Queue and cancellation</text><text class="body ink" x="958" y="797">• Dependencies and transfers</text><text class="body ink" x="958" y="828">• Observed run stages</text>
  <rect class="dark" x="148" y="900" width="1144" height="50" rx="10"/><text class="label white" x="174" y="932">Scientific record</text><text class="body white" x="433" y="932">SQLite · workflow versions · plans · runs · transfers · provenance · audit</text>
  <path class="arrow" d="M720 980v52"/><text class="small muted" x="555" y="1015">RUNTIME AND CONNECTION ADAPTERS</text>
  <rect class="frame" x="112" y="1066" width="1216" height="100" rx="22"/><rect class="dark" x="144" y="1044" width="218" height="38" rx="7"/><text class="small white" x="164" y="1069">EXECUTION PLANE</text><text class="label ink" x="174" y="1128">SimGrid</text><text class="label ink" x="445" y="1128">Kubernetes</text><text class="label ink" x="736" y="1128">SSH / Slurm</text><text class="label ink" x="1028" y="1128">Cloud and local</text><line class="rule" x1="393" y1="1101" x2="393" y2="1146"/><line class="rule" x1="678" y1="1101" x2="678" y2="1146"/><line class="rule" x1="969" y1="1101" x2="969" y2="1146"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">AkôFlow control-plane components</title><desc id="desc">Desktop and API clients call one AkôFlow daemon. Its persistent event loop coordinates planning, execution, cloud lifecycle and data preparation before adapters communicate with local, Kubernetes, SSH or Slurm, and cloud targets.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#151515"/></marker></defs>
  <rect width="960" height="420" rx="14" fill="#fff" stroke="#151515"/><g font-family="system-ui, sans-serif" fill="#151515"><rect x="350" y="22" width="260" height="46" rx="8" fill="#f2f2f2" stroke="#151515"/><text x="480" y="51" text-anchor="middle" font-size="16" font-weight="700">Desktop and API clients</text><text x="480" y="88" text-anchor="middle" font-size="12">authenticated HTTP</text></g>
  <rect x="96" y="112" width="768" height="202" rx="12" fill="#f7f7f7" stroke="#151515" stroke-width="1.5"/><text x="122" y="141" font-family="system-ui, sans-serif" font-size="16" font-weight="700">AkôFlow daemon</text>
  <g fill="#fff" stroke="#151515" stroke-width="1.25"><rect x="124" y="164" width="212" height="66" rx="7"/><rect x="374" y="164" width="212" height="66" rx="7"/><rect x="624" y="164" width="212" height="66" rx="7"/><rect x="249" y="256" width="212" height="36" rx="7"/><rect x="499" y="256" width="212" height="36" rx="7"/></g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#151515"><g font-size="14" font-weight="700"><text x="230" y="190">REST API and services</text><text x="480" y="190">Persistent event loop</text><text x="730" y="190">SQLite repositories</text><text x="355" y="279">Planning · execution · cloud</text><text x="605" y="279">Data preparation · transfers</text></g><g font-size="11"><text x="230" y="210">validation and durable requests</text><text x="480" y="210">typed jobs and recovery</text><text x="730" y="210">operational and evidence records</text></g></g>
  <g stroke="#151515" stroke-width="2" marker-end="url(#arrow)"><path d="M480 68V108"/><path d="M336 197H366"/><path d="M586 197H616"/><path d="M480 230V252"/><path d="M355 292V338"/><path d="M605 292V338"/></g>
  <g fill="#f2f2f2" stroke="#151515"><rect x="80" y="350" width="155" height="42" rx="7"/><rect x="285" y="350" width="155" height="42" rx="7"/><rect x="490" y="350" width="155" height="42" rx="7"/><rect x="695" y="350" width="155" height="42" rx="7"/></g><g font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle"><text x="157" y="376">Local</text><text x="362" y="376">Kubernetes</text><text x="567" y="376">SSH / Slurm</text><text x="772" y="376">Cloud</text></g>
</svg>

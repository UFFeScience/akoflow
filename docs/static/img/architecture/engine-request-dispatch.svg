<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">Request dispatch through the AkôFlow engine</title><desc id="desc">An HTTP request is validated and persisted as a typed queue job. The persistent dispatcher hands jobs to planning, execution, cloud, transfer, monitoring, and maintenance handlers.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#151515"/></marker></defs><rect width="960" height="220" rx="14" fill="#fff" stroke="#151515"/>
  <g fill="#f2f2f2" stroke="#151515"><rect x="36" y="84" width="128" height="52" rx="8"/><rect x="220" y="84" width="156" height="52" rx="8"/><rect x="432" y="84" width="160" height="52" rx="8"/><rect x="700" y="26" width="180" height="42" rx="7"/><rect x="700" y="89" width="180" height="42" rx="7"/><rect x="700" y="152" width="180" height="42" rx="7"/></g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" font-size="13"><text x="100" y="115">HTTP request</text><text x="298" y="108">validate and persist</text><text x="298" y="124">typed queue job</text><text x="512" y="115">persistent dispatcher</text><text x="790" y="52">planning handler</text><text x="790" y="115">execution handler</text><text x="790" y="178">cloud · transfer · monitoring</text></g>
  <g stroke="#151515" stroke-width="2" marker-end="url(#arrow)"><path d="M164 110H210"/><path d="M376 110H422"/><path d="M592 110H680V47H690"/><path d="M592 110H690"/><path d="M592 110H680V173H690"/></g>

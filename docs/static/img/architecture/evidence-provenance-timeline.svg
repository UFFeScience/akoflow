<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" role="img" aria-labelledby="title desc">
  <title id="title">Plan and observed evidence timeline</title><desc id="desc">A selected plan holds assignments and predictions. The execution run produces task attempts, handles, transfers, logs and artifact manifests, which form execution trace and provenance records.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#151515"/></marker></defs><rect width="960" height="210" rx="14" fill="#fff" stroke="#151515"/>
  <g fill="#f2f2f2" stroke="#151515"><rect x="35" y="72" width="160" height="66" rx="8"/><rect x="274" y="72" width="160" height="66" rx="8"/><rect x="513" y="72" width="190" height="66" rx="8"/><rect x="782" y="72" width="145" height="66" rx="8"/></g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#151515"><g font-size="14" font-weight="700"><text x="115" y="99">Selected plan</text><text x="354" y="99">Execution run</text><text x="608" y="99">Runtime observations</text><text x="855" y="99">Trace and lineage</text></g><g font-size="11"><text x="115" y="119">assignments · predictions</text><text x="354" y="119">dispatch boundary</text><text x="608" y="119">tasks · handles · data · logs</text><text x="855" y="119">metrics · provenance</text></g></g>
  <g fill="none" stroke="#151515" stroke-width="2" marker-end="url(#arrow)"><path d="M195 105H264"/><path d="M434 105H503"/><path d="M703 105H772"/></g><text x="480" y="173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#555">Observed records sit beside the prediction; they do not rewrite it.</text>
</svg>

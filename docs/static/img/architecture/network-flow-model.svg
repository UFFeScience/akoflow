<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" role="img" aria-labelledby="title desc">
  <title id="title">From workflow dependency to network flow</title><desc id="desc">A control dependency orders producer and consumer activities. A data dependency supplies logical bytes. If the selected placement puts the activities on different resources, a directed topology route can produce a transfer.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#151515"/></marker></defs><rect width="960" height="290" rx="14" fill="#fff" stroke="#151515"/>
  <g fill="#f2f2f2" stroke="#151515"><rect x="70" y="50" width="170" height="56" rx="8"/><rect x="360" y="50" width="170" height="56" rx="8"/><rect x="70" y="184" width="170" height="56" rx="8"/><rect x="720" y="184" width="170" height="56" rx="8"/></g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#151515"><g font-size="14" font-weight="700"><text x="155" y="78">Producer activity</text><text x="445" y="78">Consumer activity</text><text x="155" y="212">Producer resource</text><text x="805" y="212">Consumer resource</text></g><g font-size="11"><text x="155" y="96">produces logical data</text><text x="445" y="96">waits for predecessor</text><text x="155" y="230">selected placement</text><text x="805" y="230">selected placement</text></g></g>
  <path d="M240 78H350" fill="none" stroke="#151515" stroke-width="2" marker-end="url(#arrow)"/><text x="295" y="61" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11">control dependency</text>
  <path d="M155 106V150H445V116" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="300" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#555">data dependency · logical bytes</text>
  <path d="M240 212H710" fill="none" stroke="#151515" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="197" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11">directed topology route when resources differ</text>
  <text x="480" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#555">Same-resource placement adds no network transfer time for that dependency.</text>
</svg>

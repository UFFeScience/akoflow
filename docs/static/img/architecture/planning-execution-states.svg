<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Planning and execution state flow</title><desc id="desc">A planning request becomes a queued planning session, algorithm runs and candidates before a selected schedule plan. Separately, an execution request becomes a durable queue job and then a running execution run that ends in completed or failed evidence.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#151515"/></marker></defs><rect width="960" height="260" rx="14" fill="#fff" stroke="#151515"/>
  <g font-family="system-ui, sans-serif" fill="#151515"><text x="34" y="36" font-size="15" font-weight="700">Planning</text><text x="34" y="164" font-size="15" font-weight="700">Execution</text></g>
  <g fill="#f2f2f2" stroke="#151515"><rect x="132" y="18" width="130" height="44" rx="7"/><rect x="306" y="18" width="142" height="44" rx="7"/><rect x="492" y="18" width="126" height="44" rx="7"/><rect x="662" y="18" width="116" height="44" rx="7"/><rect x="822" y="18" width="108" height="44" rx="7"/><rect x="132" y="146" width="126" height="44" rx="7"/><rect x="302" y="146" width="134" height="44" rx="7"/><rect x="480" y="146" width="138" height="44" rx="7"/><rect x="662" y="146" width="126" height="44" rx="7"/><rect x="832" y="146" width="98" height="44" rx="7"/></g>
  <g font-family="system-ui, sans-serif" font-size="12" text-anchor="middle"><text x="197" y="45">request</text><text x="377" y="45">planning session</text><text x="555" y="45">algorithm runs</text><text x="720" y="45">candidates</text><text x="876" y="45">selected plan</text><text x="195" y="173">request</text><text x="369" y="173">durable queue job</text><text x="549" y="173">execution run</text><text x="725" y="173">evidence</text><text x="881" y="173">terminal</text></g>
  <g stroke="#151515" stroke-width="2" marker-end="url(#arrow)"><path d="M262 40H296"/><path d="M448 40H482"/><path d="M618 40H652"/><path d="M778 40H812"/><path d="M258 168H292"/><path d="M436 168H470"/><path d="M618 168H652"/><path d="M788 168H822"/></g>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#555"><text x="370" y="87">failed or cancelled planning is terminal; candidates already persisted are retained.</text><text x="662" y="216">completed or failed evidence is persisted with the run.</text></g>
</svg>

  <g fill="#f2f2f2" stroke="#151515"><rect x="34" y="96" width="200" height="68" rx="8"/><rect x="320" y="96" width="150" height="68" rx="8"/><rect x="582" y="44" width="142" height="54" rx="8"/><rect x="582" y="162" width="142" height="54" rx="8"/><rect x="796" y="96" width="130" height="68" rx="8"/></g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#151515"><g font-size="14" font-weight="700"><text x="134" y="124">Frozen input</text><text x="395" y="124">Planning session</text><text x="653" y="74">Algorithm run</text><text x="653" y="192">Algorithm run</text><text x="861" y="124">Schedule plan</text></g><g font-size="11"><text x="134" y="145">workflow · scope · snapshots</text><text x="395" y="145">one comparison boundary</text><text x="653" y="91">candidate set</text><text x="653" y="209">candidate set</text><text x="861" y="145">one selected candidate</text></g></g>
  <g stroke="#151515" stroke-width="2" marker-end="url(#arrow)"><path d="M234 130H310"/><path d="M470 120L572 76"/><path d="M470 140L572 188"/><path d="M724 76L786 116"/><path d="M724 188L786 144"/></g><text x="753" y="51" font-family="system-ui, sans-serif" font-size="11" fill="#555">compare rank and Pareto metadata</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="title desc">
  <title id="title">AkôFlow record chain</title><desc id="desc">Environment definitions become published versions and execution scopes. Immutable workflow versions join the planning session. Candidates become a selected plan, which leads to an execution run and observed tasks, transfers, artifacts, provenance and audit records.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#151515"/></marker></defs><rect width="960" height="270" rx="14" fill="#fff" stroke="#151515"/>
  <g fill="#f2f2f2" stroke="#151515"><rect x="28" y="36" width="152" height="50" rx="7"/><rect x="218" y="36" width="152" height="50" rx="7"/><rect x="408" y="36" width="152" height="50" rx="7"/><rect x="598" y="36" width="152" height="50" rx="7"/><rect x="788" y="36" width="144" height="50" rx="7"/><rect x="218" y="156" width="152" height="50" rx="7"/><rect x="598" y="156" width="152" height="50" rx="7"/></g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" font-size="12"><text x="104" y="58">environment</text><text x="104" y="74">definition</text><text x="294" y="58">published version</text><text x="294" y="74">and scope</text><text x="484" y="58">planning session</text><text x="674" y="58">selected plan</text><text x="860" y="58">execution run</text><text x="294" y="178">workflow definition</text><text x="294" y="194">and immutable version</text><text x="674" y="178">tasks · transfers</text><text x="674" y="194">artifacts · provenance · audit</text></g>
  <g stroke="#151515" stroke-width="2" marker-end="url(#arrow)"><path d="M180 61H208"/><path d="M370 61H398"/><path d="M560 61H588"/><path d="M750 61H778"/><path d="M370 181H450V94"/><path d="M860 86V146H750"/></g><text x="504" y="114" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#555">workflow and scope reference the same planning boundary</text>
</svg>

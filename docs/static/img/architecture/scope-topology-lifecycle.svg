<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 190" role="img" aria-labelledby="title desc">
  <title id="title">Execution scope and network topology lifecycle</title><desc id="desc">Published environment versions and their resources are selected into an execution scope. The scope owns a network topology that is supplied to planning sessions and schedule plans.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#151515"/></marker></defs><rect width="960" height="190" rx="14" fill="#fff" stroke="#151515"/>
  <g fill="#f2f2f2" stroke="#151515"><rect x="40" y="54" width="170" height="70" rx="8"/><rect x="275" y="54" width="160" height="70" rx="8"/><rect x="500" y="54" width="170" height="70" rx="8"/><rect x="735" y="54" width="185" height="70" rx="8"/></g>
  <g font-family="system-ui, sans-serif" text-anchor="middle"><g font-size="14" font-weight="700"><text x="125" y="82">Environment versions</text><text x="355" y="82">Execution scope</text><text x="585" y="82">Network topology</text><text x="828" y="82">Planning session / plan</text></g><g font-size="11"><text x="125" y="103">published resources</text><text x="355" y="103">selected infrastructure</text><text x="585" y="103">directed resource links</text><text x="828" y="103">frozen evaluation context</text></g></g>
  <g fill="none" stroke="#151515" stroke-width="2" marker-end="url(#arrow)"><path d="M210 89H265"/><path d="M435 89H490"/><path d="M670 89H725"/></g><text x="125" y="153" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#555">resources</text><path d="M125 128V144H355V128" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>

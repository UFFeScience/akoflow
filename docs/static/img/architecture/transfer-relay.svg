<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
  <title id="title">Data transfer relay</title><desc id="desc">A producer runtime, route selection, transfer strategies, digest verification, and a consumer runtime.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#151515"/></marker></defs>
  <rect width="960" height="350" rx="14" fill="#fff" stroke="#151515"/>
  <g fill="#f2f2f2" stroke="#151515"><rect x="50" y="74" width="190" height="76" rx="8"/><rect x="385" y="74" width="190" height="76" rx="8"/><rect x="720" y="74" width="190" height="76" rx="8"/><rect x="68" y="216" width="150" height="42" rx="7"/><rect x="270" y="216" width="150" height="42" rx="7"/><rect x="472" y="216" width="150" height="42" rx="7"/><rect x="674" y="216" width="150" height="42" rx="7"/></g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#151515"><g font-size="14" font-weight="700"><text x="145" y="104">Producer runtime</text><text x="480" y="104">Route selection</text><text x="815" y="104">Consumer runtime</text></g><g font-size="11"><text x="145" y="124">file · digest · size</text><text x="480" y="124">capability · identity · fallback</text><text x="815" y="124">prepared workspace</text></g><g font-size="11"><text x="143" y="242">shared storage</text><text x="345" y="242">pull / push</text><text x="547" y="242">gateway</text><text x="749" y="242">direct / local</text></g></g>
  <g fill="none" stroke="#151515" stroke-width="2" marker-end="url(#arrow)"><path d="M240 112H375"/><path d="M575 112H710"/></g><g fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="5 4"><path d="M145 150V196"/><path d="M480 150V196"/><path d="M815 150V196"/></g>
  <text x="480" y="43" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#151515">Transfer relay: select a route, move bytes, verify the destination</text><text x="480" y="298" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#555">A dependent activity starts only after the expected digest is verified: planned → transferring → verifying → committed.</text><text x="480" y="322" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#555">The recorded route retains its strategy, reason, fallback, logical bytes, network bytes, chunks, and attempts.</text>
</svg>

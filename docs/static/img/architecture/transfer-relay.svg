<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">AkôFlow data transfer relay</title><desc id="desc">An artifact leaves a producer runtime, has a route selected, is verified by digest, and arrives at a consumer runtime.</desc>
  <style>.title{font:700 28px system-ui,sans-serif;fill:#15263d}.label{font:600 18px system-ui,sans-serif;fill:#15263d}.text{font:15px system-ui,sans-serif;fill:#38506a}.small{font:13px system-ui,sans-serif;fill:#38506a}.box{stroke:#285f9e;stroke-width:2;rx:14}.line{stroke:#285f9e;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#71879d;stroke-width:2;stroke-dasharray:7 7;fill:none}.pill{stroke:#8a5d00;stroke-width:2;fill:#fff7df;rx:18}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#285f9e"/></marker></defs><rect width="1200" height="620" fill="#f8fbff"/>
  <text x="54" y="58" class="title">Transfer relay: selection, movement, and verification</text>
  <rect x="55" y="145" width="230" height="140" class="box" fill="#e8f2ff"/><text x="82" y="186" class="label">Producer runtime</text><text x="82" y="218" class="text">local · SSH · Slurm</text><text x="82" y="244" class="text">Kubernetes · cloud</text><text x="82" y="270" class="small">file + digest + size</text>
  <rect x="460" y="105" width="285" height="220" class="box" fill="#edf9f2"/><text x="500" y="148" class="label">Route planner</text><text x="500" y="181" class="text">capability and connectivity</text><text x="500" y="207" class="text">credential reference</text><text x="500" y="233" class="text">source, target, fallback</text><text x="500" y="279" class="small">does not copy secrets into workflows</text>
  <rect x="915" y="145" width="230" height="140" class="box" fill="#e8f2ff"/><text x="942" y="186" class="label">Consumer runtime</text><text x="942" y="218" class="text">prepared workspace</text><text x="942" y="244" class="text">activity starts only after</text><text x="942" y="270" class="small">digest confirmation</text>
  <path d="M286 214 H458" class="line"/><path d="M747 214 H913" class="line"/>
  <rect x="79" y="414" width="205" height="54" class="pill"/><text x="111" y="448" class="label">shared storage</text><rect x="323" y="414" width="175" height="54" class="pill"/><text x="355" y="448" class="label">pull / push</text><rect x="538" y="414" width="151" height="54" class="pill"/><text x="570" y="448" class="label">gateway</text><rect x="729" y="414" width="172" height="54" class="pill"/><text x="756" y="448" class="label">runtime-local</text><rect x="941" y="414" width="178" height="54" class="pill"/><text x="966" y="448" class="label">direct-runtime</text>
  <path d="M170 286 V404 M410 325 V404 M615 325 V404 M815 286 V404 M1030 286 V404" class="dash"/>
  <text x="55" y="546" class="text">The strategy describes a logical path. Gateway can stream through connectors; direct-runtime keeps bytes between runtimes when the route and temporary identity are verified.</text><text x="55" y="578" class="small">Observed states: planned → transferring → verifying → committed, or failed. Record logical bytes, network bytes, chunks, attempts, and digests.</text>
</svg>

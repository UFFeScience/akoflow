<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">Transfer strategies by environment</title><desc id="desc">A matrix relating local, Kubernetes, HPC, SSH, cloud, and simulation environments to applicable transfer strategies.</desc><style>.head{font:700 25px system-ui,sans-serif;fill:#15263d}.label{font:600 17px system-ui,sans-serif;fill:#15263d}.text{font:14px system-ui,sans-serif;fill:#38506a}.cell{stroke:#c7d6e5;stroke-width:1}.yes{fill:#e7f7ed}.cond{fill:#fff4d6}.no{fill:#f2f5f8}</style><rect width="1200" height="510" fill="#f8fbff"/><text x="46" y="48" class="head">Choose a strategy for the environment</text>
  <rect x="46" y="80" width="260" height="54" class="cell" fill="#dceafa"/><text x="66" y="113" class="label">Environment / runtime</text><rect x="306" y="80" width="300" height="54" class="cell" fill="#dceafa"/><text x="326" y="113" class="label">Preferred path</text><rect x="606" y="80" width="300" height="54" class="cell" fill="#dceafa"/><text x="626" y="113" class="label">Controlled alternative</text><rect x="906" y="80" width="248" height="54" class="cell" fill="#dceafa"/><text x="926" y="113" class="label">Verify first</text>
  <g class="text"><rect x="46" y="134" width="260" height="56" class="cell yes"/><text x="66" y="168">Local ↔ local</text><rect x="306" y="134" width="300" height="56" class="cell yes"/><text x="326" y="168">runtime-local / filesystem</text><rect x="606" y="134" width="300" height="56" class="cell cond"/><text x="626" y="168">artifact store</text><rect x="906" y="134" width="248" height="56" class="cell yes"/><text x="926" y="168">workspace and digest</text><rect x="46" y="190" width="260" height="56" class="cell yes"/><text x="66" y="224">Kubernetes</text><rect x="306" y="190" width="300" height="56" class="cell yes"/><text x="326" y="224">PVC / shared storage</text><rect x="606" y="190" width="300" height="56" class="cell cond"/><text x="626" y="224">Kubernetes exec / gateway</text><rect x="906" y="190" width="248" height="56" class="cell yes"/><text x="926" y="224">PVC, namespace, RBAC</text><rect x="46" y="246" width="260" height="56" class="cell yes"/><text x="66" y="280">HPC / Slurm</text><rect x="306" y="246" width="300" height="56" class="cell yes"/><text x="326" y="280">shared scratch</text><rect x="606" y="246" width="300" height="56" class="cell cond"/><text x="626" y="280">rsync/SSH gateway</text><rect x="906" y="246" width="248" height="56" class="cell yes"/><text x="926" y="280">compute-node visibility</text><rect x="46" y="302" width="260" height="56" class="cell yes"/><text x="66" y="336">SSH / remote</text><rect x="306" y="302" width="300" height="56" class="cell yes"/><text x="326" y="336">rsync/SSH</text><rect x="606" y="302" width="300" height="56" class="cell cond"/><text x="626" y="336">S3 / HTTP / gateway</text><rect x="906" y="302" width="248" height="56" class="cell yes"/><text x="926" y="336">host key and route</text><rect x="46" y="358" width="260" height="56" class="cell yes"/><text x="66" y="392">Cloud VM ↔ cloud VM</text><rect x="306" y="358" width="300" height="56" class="cell yes"/><text x="326" y="392">direct-runtime</text><rect x="606" y="358" width="300" height="56" class="cell cond"/><text x="626" y="392">gateway / artifact store</text><rect x="906" y="358" width="248" height="56" class="cell yes"/><text x="926" y="392">temporary identity, ACL</text><rect x="46" y="414" width="260" height="56" class="cell no"/><text x="66" y="448">SimGrid</text><rect x="306" y="414" width="300" height="56" class="cell no"/><text x="326" y="448">transfer model</text><rect x="606" y="414" width="300" height="56" class="cell no"/><text x="626" y="448">does not move real bytes</text><rect x="906" y="414" width="248" height="56" class="cell no"/><text x="926" y="448">topology and profiles</text></g>
</svg>

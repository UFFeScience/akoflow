<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Transfer strategies by runtime</title><desc id="desc">Preferred paths, controlled alternatives, and verification points for local, Kubernetes, HPC, SSH, cloud, and simulation runtimes.</desc>
  <rect width="960" height="390" rx="14" fill="#fff" stroke="#151515"/>
  <g fill="#f2f2f2" stroke="#151515"><rect x="34" y="56" width="174" height="42" rx="7"/><rect x="208" y="56" width="268" height="42" rx="7"/><rect x="476" y="56" width="246" height="42" rx="7"/><rect x="722" y="56" width="204" height="42" rx="7"/></g>
  <g fill="#f2f2f2" stroke="#151515"><rect x="34" y="98" width="174" height="42"/><rect x="208" y="98" width="268" height="42"/><rect x="476" y="98" width="246" height="42"/><rect x="722" y="98" width="204" height="42"/><rect x="34" y="140" width="174" height="42"/><rect x="208" y="140" width="268" height="42"/><rect x="476" y="140" width="246" height="42"/><rect x="722" y="140" width="204" height="42"/><rect x="34" y="182" width="174" height="42"/><rect x="208" y="182" width="268" height="42"/><rect x="476" y="182" width="246" height="42"/><rect x="722" y="182" width="204" height="42"/><rect x="34" y="224" width="174" height="42"/><rect x="208" y="224" width="268" height="42"/><rect x="476" y="224" width="246" height="42"/><rect x="722" y="224" width="204" height="42"/><rect x="34" y="266" width="174" height="42"/><rect x="208" y="266" width="268" height="42"/><rect x="476" y="266" width="246" height="42"/><rect x="722" y="266" width="204" height="42"/></g>
  <g font-family="system-ui, sans-serif" fill="#151515"><g font-size="13" font-weight="700"><text x="50" y="82">Runtime</text><text x="224" y="82">Preferred path</text><text x="492" y="82">Controlled alternative</text><text x="738" y="82">Verify first</text></g><g font-size="11"><text x="50" y="124">Local ↔ local</text><text x="224" y="124">runtime-local / filesystem</text><text x="492" y="124">artifact store</text><text x="738" y="124">workspace and digest</text><text x="50" y="166">Kubernetes</text><text x="224" y="166">PVC / shared storage</text><text x="492" y="166">Kubernetes exec / gateway</text><text x="738" y="166">PVC, namespace, RBAC</text><text x="50" y="208">HPC / Slurm</text><text x="224" y="208">shared scratch</text><text x="492" y="208">rsync/SSH gateway</text><text x="738" y="208">compute-node visibility</text><text x="50" y="250">SSH / remote</text><text x="224" y="250">rsync/SSH</text><text x="492" y="250">S3 / HTTP / gateway</text><text x="738" y="250">host key and route</text><text x="50" y="292">Cloud VM ↔ cloud VM</text><text x="224" y="292">direct-runtime</text><text x="492" y="292">gateway / artifact store</text><text x="738" y="292">temporary identity, ACL</text><text x="50" y="334">SimGrid</text><text x="224" y="334">transfer model</text><text x="492" y="334">does not move real bytes</text><text x="738" y="334">topology and profiles</text></g></g>
  <text x="480" y="31" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#151515">Choose the least invasive route that the selected runtime can verify</text><text x="480" y="368" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#555">A capability declaration is not sufficient evidence: verify connection, path, identity, and destination access for the concrete run.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">Estratégias de transferência por ambiente</title>
  <desc id="desc">Tabela visual que associa ambientes local, Kubernetes, HPC, SSH, cloud e simulação às estratégias de transferência aplicáveis.</desc>
  <style>.head{font:700 25px system-ui,sans-serif;fill:#15263d}.label{font:600 17px system-ui,sans-serif;fill:#15263d}.text{font:14px system-ui,sans-serif;fill:#38506a}.cell{stroke:#c7d6e5;stroke-width:1}.yes{fill:#e7f7ed}.cond{fill:#fff4d6}.no{fill:#f2f5f8}</style>
  <rect width="1200" height="510" fill="#f8fbff"/><text x="46" y="48" class="head">Escolha da estratégia conforme o ambiente</text>
  <rect x="46" y="80" width="260" height="54" class="cell" fill="#dceafa"/><text x="66" y="113" class="label">Ambiente / runtime</text>
  <rect x="306" y="80" width="300" height="54" class="cell" fill="#dceafa"/><text x="326" y="113" class="label">Caminho preferencial</text>
  <rect x="606" y="80" width="300" height="54" class="cell" fill="#dceafa"/><text x="626" y="113" class="label">Alternativa controlada</text>
  <rect x="906" y="80" width="248" height="54" class="cell" fill="#dceafa"/><text x="926" y="113" class="label">Verificar antes</text>
  <g class="text">
    <rect x="46" y="134" width="260" height="56" class="cell yes"/><text x="66" y="168">Local ↔ local</text><rect x="306" y="134" width="300" height="56" class="cell yes"/><text x="326" y="168">runtime-local / filesystem</text><rect x="606" y="134" width="300" height="56" class="cell cond"/><text x="626" y="168">artifact store</text><rect x="906" y="134" width="248" height="56" class="cell yes"/><text x="926" y="168">workspace e digest</text>
    <rect x="46" y="190" width="260" height="56" class="cell yes"/><text x="66" y="224">Kubernetes</text><rect x="306" y="190" width="300" height="56" class="cell yes"/><text x="326" y="224">PVC / shared-storage</text><rect x="606" y="190" width="300" height="56" class="cell cond"/><text x="626" y="224">Kubernetes exec / gateway</text><rect x="906" y="190" width="248" height="56" class="cell yes"/><text x="926" y="224">PVC, namespace, RBAC</text>
    <rect x="46" y="246" width="260" height="56" class="cell yes"/><text x="66" y="280">HPC / Slurm</text><rect x="306" y="246" width="300" height="56" class="cell yes"/><text x="326" y="280">scratch compartilhado</text><rect x="606" y="246" width="300" height="56" class="cell cond"/><text x="626" y="280">rsync/SSH gateway</text><rect x="906" y="246" width="248" height="56" class="cell yes"/><text x="926" y="280">visibilidade no compute node</text>
    <rect x="46" y="302" width="260" height="56" class="cell yes"/><text x="66" y="336">SSH / remoto</text><rect x="306" y="302" width="300" height="56" class="cell yes"/><text x="326" y="336">rsync/SSH</text><rect x="606" y="302" width="300" height="56" class="cell cond"/><text x="626" y="336">S3 / HTTP / gateway</text><rect x="906" y="302" width="248" height="56" class="cell yes"/><text x="926" y="336">host key e rota</text>
    <rect x="46" y="358" width="260" height="56" class="cell yes"/><text x="66" y="392">Cloud VM ↔ Cloud VM</text><rect x="306" y="358" width="300" height="56" class="cell yes"/><text x="326" y="392">direct-runtime</text><rect x="606" y="358" width="300" height="56" class="cell cond"/><text x="626" y="392">gateway / artifact store</text><rect x="906" y="358" width="248" height="56" class="cell yes"/><text x="926" y="392">identidade efêmera, ACL</text>
    <rect x="46" y="414" width="260" height="56" class="cell no"/><text x="66" y="448">SimGrid</text><rect x="306" y="414" width="300" height="56" class="cell no"/><text x="326" y="448">modelo de transferência</text><rect x="606" y="414" width="300" height="56" class="cell no"/><text x="626" y="448">não move bytes reais</text><rect x="906" y="414" width="248" height="56" class="cell no"/><text x="926" y="448">topologia e perfis</text>
  </g>
</svg>

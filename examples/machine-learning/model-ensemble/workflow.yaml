name: showcase-model-ensemble
spec:
  namespace: showcase
  # Published by .github/workflows/build-showcase.yml.
  image: ghcr.io/uffescience/akoflow-showcase-model-ensemble:v1
  activities:
    - name: dataset
      runtime: local
      # The local executor launches this OCI image through Docker in run.sh.
      run: docker run --rm ghcr.io/uffescience/akoflow-showcase-model-ensemble:v1 dataset
      cpuLimit: "1"
      memoryLimit: 256Mi
    - name: rf
      runtime: local
      # The local executor launches this OCI image through Docker in run.sh.
      run: docker run --rm ghcr.io/uffescience/akoflow-showcase-model-ensemble:v1 rf
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - dataset
    - name: svm
      runtime: local
      # The local executor launches this OCI image through Docker in run.sh.
      run: docker run --rm ghcr.io/uffescience/akoflow-showcase-model-ensemble:v1 svm
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - rf
    - name: xgb
      runtime: local
      # The local executor launches this OCI image through Docker in run.sh.
      run: docker run --rm ghcr.io/uffescience/akoflow-showcase-model-ensemble:v1 xgb
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - svm
    - name: ensemble
      runtime: local
      # The local executor launches this OCI image through Docker in run.sh.
      run: docker run --rm ghcr.io/uffescience/akoflow-showcase-model-ensemble:v1 ensemble
      cpuLimit: "1"
      memoryLimit: 256Mi
      dependsOn:
        - xgb


environment:
  id: simulation-example
  name: Edge Cloud Simulation
  description: Deterministic environment used by the simulation example
  status: ready

version:
  id: simulation-example-v1
  environmentId: simulation-example
  version: 1
  status: published
  networkModel: static-links
  interferenceModel: none
  costModel: per-second
  configurationHash: simulation-example-v1

runtimes:
  - environmentVersionId: simulation-example-v1
    id: simgrid
    name: SimGrid
    driver: simgrid
    mode: simulation
    role: simulation
    capabilities:
      simulation: true

resources:
  - id: simulated-edge
    environmentVersionId: simulation-example-v1
    executionTarget: batch
    type: fog_device
    name: Simulated edge
    providerId: simulated-edge
    tier: edge
    cpuCores: 2
    cpuCapacity: 2
    memoryBytes: 2147483648
    storageBytes: 21474836480
    computeSpeedup: 1
    pricePerSecond: 0
    bootOverheadSeconds: 0
    containerOverheadSeconds: 0.1
    schedulable: true

  - id: simulated-cloud
    environmentVersionId: simulation-example-v1
    executionTarget: batch
    type: cloud_vm
    name: Simulated cloud VM
    providerId: simulated-cloud
    tier: cloud
    cpuCores: 8
    cpuCapacity: 8
    memoryBytes: 17179869184
    storageBytes: 107374182400
    computeSpeedup: 4
    pricePerSecond: 0.001
    bootOverheadSeconds: 0.5
    containerOverheadSeconds: 0.2
    schedulable: true

storages: []
connections: []
activityResourceProfiles: []

resourceRuntimeBindings:
  - {resourceId: simulated-edge, runtimeId: simgrid, enabled: true}
  - {resourceId: simulated-cloud, runtimeId: simgrid, enabled: true}

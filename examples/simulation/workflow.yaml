name: simulation-example-workflow
spec:
  namespace: examples
  image: busybox:1.36
  activities:
    - name: prepare
      runtime: simgrid
      run: prepare-data
      cpuLimit: "1"
      memoryLimit: 128Mi
    - name: analyze
      runtime: simgrid
      run: analyze-data
      cpuLimit: "2"
      memoryLimit: 1Gi
      dependsOn:
        - prepare
    - name: summarize
      runtime: simgrid
      run: summarize-results
      cpuLimit: "1"
      memoryLimit: 128Mi
      dependsOn:
        - analyze

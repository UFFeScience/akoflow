name: akoflow-desktop

services:
  buildkit:
    image: ghcr.io/uffescience/akoflow-buildkit:${AKOFLOW_VERSION:-latest}
    restart: unless-stopped
    privileged: true
    volumes:
      - buildkit-data:/var/lib/buildkit
    networks:
      - control-plane

  daemon:
    image: ghcr.io/uffescience/akoflow-daemon:${AKOFLOW_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      buildkit:
        condition: service_healthy
    ports:
      - "127.0.0.1::8080"
    environment:
      AKOFLOW_HTTP_ADDRESS: 0.0.0.0:8080
      AKOFLOW_API_TOKEN: ${AKOFLOW_API_TOKEN:?AKOFLOW_API_TOKEN must be set}
      AKOFLOW_API_ALLOWED_ORIGINS: ${AKOFLOW_API_ALLOWED_ORIGINS:-}
      AKOFLOW_SERVER_VERSION: ${AKOFLOW_VERSION:-latest}
      AKOFLOW_DATABASE_PATH: /var/lib/akoflow/database.db
      AKOFLOW_ARTIFACT_STORE_ROOT: /var/lib/akoflow/artifacts
      AKOFLOW_BUILDCTL: buildctl
      AKOFLOW_APPTAINER: apptainer
      AKOFLOW_SIMGRID_BINARY: /usr/local/bin/akoflow-simgrid-runner
      AKOFLOW_RESTART_ON_INSTANCE_SWITCH: 'true'
      AKOFLOW_SIMGRID_WORKSPACE: /var/lib/akoflow/simgrid
      AKOFLOW_SSH_KEY_DIRECTORY: /var/lib/akoflow/credentials/ssh
      AKOFLOW_KUBERNETES_TOKEN_DIRECTORY: /var/lib/akoflow/credentials/kubernetes
      AKOFLOW_CONSOLE_ENABLED: ${AKOFLOW_CONSOLE_ENABLED:-true}
      BUILDKIT_HOST: tcp://buildkit:1234
    volumes:
      - akoflow-data:/var/lib/akoflow
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - control-plane

volumes:
  akoflow-data:
    name: akoflow-desktop-data
  buildkit-data:
    name: akoflow-desktop-buildkit

networks:
  control-plane:
    name: akoflow-desktop-control-plane
